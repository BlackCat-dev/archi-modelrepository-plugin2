
name: Build coArchi2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check build environment
        run: |
          java -version
          javac -version
          mvn -version
          git --version

      - name: Check coArchi2 version
        run: |
          grep Bundle-Version com.archimatetool.modelrepository/META-INF/MANIFEST.MF
          ls -la
