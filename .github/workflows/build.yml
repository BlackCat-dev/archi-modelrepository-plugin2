
name: Build coArchi2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Archi 5.10.0
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p archi-dist

          curl -fL --retry 3 \
            "https://www.archimatetool.com/downloads/archi/archive/5.10.0/Archi-Linux64-5.10.0.tgz" \
            -o archi.tgz

          tar -xzf archi.tgz -C archi-dist

          echo "Archi successfully extracted"

      - name: Prepare all dependencies
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dependencies

          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path("archi-dist").resolve()
          output = Path("dependencies").resolve()

          entries = set()
          classes = set()

          def process_jar(jar):
              entries.add(str(jar.resolve()))

              with zipfile.ZipFile(jar) as z:
                  for name in z.namelist():
                      if name.endswith(".class"):
                          classes.add(name)

                      elif name.endswith(".jar"):
                          target = output / (
                              str(len(entries)) + "-" +
                              Path(name).name
                          )

                          target.write_bytes(z.read(name))
                          process_jar(target)

          plugin_dirs = [
              p for p in root.rglob("plugins")
              if p.is_dir()
          ]

          if not plugin_dirs:
              raise SystemExit("No plugins directories found")

          for plugins in plugin_dirs:
              print("Plugins directory:", plugins)

              for jar in plugins.rglob("*.jar"):
                  process_jar(jar)

              for cls in plugins.rglob("*.class"):
                  for parent in cls.parents:
                      if parent.name in ("com", "org", "net"):
                          class_root = parent.parent
                          entries.add(str(class_root))
                          classes.add(
                              cls.relative_to(class_root).as_posix()
                          )

          for jar in sorted(entries):
              if "archimatetool" in jar.lower():
                  print("Archi dependency:", jar)

          required = [
              "com/archimatetool/model/",
              "com/archimatetool/editor/utils/",
              "com/archimatetool/editor/model/",
              "com/archimatetool/editor/ui/"
          ]

          missing = []

          for package in required:
              found = any(
                  c.startswith(package)
                  for c in classes
              )

              print(
                  package,
                  "FOUND" if found else "MISSING"
              )

              if not found:
                  missing.append(package)

          Path("classpath.txt").write_text(
              ":".join(sorted(entries))
          )

          print("Classpath entries:", len(entries))
          print("Indexed classes:", len(classes))

          if missing:
              raise SystemExit(
                  "Missing Archi packages: " +
                  ", ".join(missing)
              )
          PY

      - name: Compile main plugin
        shell: bash
        run: |
          set -euo pipefail

          MAIN=com.archimatetool.modelrepository
          CP=$(cat classpath.txt)

          mkdir -p build/main-classes

          grep -q 'Bundle-Version: 1.3.5' \
            "$MAIN/META-INF/MANIFEST.MF"

          find "$MAIN/src" \
            -name '*.java' > build/main-sources.txt

          echo "Java source files:"
          wc -l build/main-sources.txt

          javac --release 21 \
            -encoding UTF-8 \
            -Xmaxerrs 200 \
            -cp "$CP" \
            -d build/main-classes \
            @build/main-sources.txt

      - name: Compile command line plugin
        shell: bash
        run: |
          set -euo pipefail

          CLI=com.archimatetool.modelrepository.commandline
          CP=$(cat classpath.txt)

          mkdir -p build/cli-classes

          find "$CLI/src" \
            -name '*.java' > build/cli-sources.txt

          javac --release 21 \
            -encoding UTF-8 \
            -Xmaxerrs 200 \
            -cp "$CP:$PWD/build/main-classes" \
            -d build/cli-classes \
            @build/cli-sources.txt

      - name: Package coArchi2
        shell: bash
        run: |
          set -euo pipefail

          MAIN=com.archimatetool.modelrepository
          CLI=com.archimatetool.modelrepository.commandline
          VERSION=1.3.5.$(date -u +%Y%m%d%H%M)

          mkdir -p build/main-bundle
          mkdir -p build/cli-bundle
          mkdir -p build/package
          mkdir -p dist

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          projects = [
              ("com.archimatetool.modelrepository", "main"),
              ("com.archimatetool.modelrepository.commandline", "cli")
          ]

          for project, name in projects:
              src = Path(project) / "src"
              dst = Path("build") / (name + "-classes")

              for p in src.rglob("*"):
                  if p.is_file() and p.suffix != ".java":
                      target = dst / p.relative_to(src)
                      target.parent.mkdir(
                          parents=True,
                          exist_ok=True
                      )
                      shutil.copy2(p, target)

              bundle = Path("build") / (name + "-bundle")

              for p in Path(project).iterdir():
                  if p.name.startswith("."):
                      continue

                  if p.name in (
                      "src",
                      "bin",
                      "target",
                      "build.properties",
                      "pom.xml"
                  ):
                      continue

                  target = bundle / p.name

                  if p.is_dir():
                      shutil.copytree(
                          p,
                          target,
                          dirs_exist_ok=True
                      )
                  else:
                      shutil.copy2(p, target)
          PY

          sed -i "s/^Bundle-Version:.*/Bundle-Version: $VERSION/" \
            build/main-bundle/META-INF/MANIFEST.MF \
            build/cli-bundle/META-INF/MANIFEST.MF

          jar --create \
            --file "build/main-bundle/$MAIN.jar" \
            -C build/main-classes .

          cp -r build/cli-classes/. build/cli-bundle/

          jar --create \
            --file "build/package/${MAIN}_${VERSION}.jar" \
            --manifest build/main-bundle/META-INF/MANIFEST.MF \
            -C build/main-bundle .

          jar --create \
            --file "build/package/${CLI}_${VERSION}.jar" \
            --manifest build/cli-bundle/META-INF/MANIFEST.MF \
            -C build/cli-bundle .

          printf '%s' \
            'Magic file to signify this is an Archi plug-in bundle.' \
            > build/package/archi-plugin

          cd build/package
          zip -r ../../dist/coArchi2_1.3.5.archiplugin .
          cd ../..

          unzip -l dist/coArchi2_1.3.5.archiplugin

      - name: Verify plugin archive
        run: |
          unzip -t dist/coArchi2_1.3.5.archiplugin
          sha256sum dist/coArchi2_1.3.5.archiplugin
          ls -lh dist/

      - name: Upload coArchi2 plugin
        uses: actions/upload-artifact@v4
        with:
          name: coArchi2-1.3.5
          path: dist/coArchi2_1.3.5.archiplugin
          if-no-files-found: error
