
name: Build coArchi2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Archi 5.10.0
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p archi-dist

          BASE="https://github.com/archimatetool/archi.io/releases/download"
          FILE="Archi-Linux64-5.10.0.tgz"

          for TAG in 5.10 5.10_0 5_10 5.10.0; do
            echo "Trying release tag: $TAG"

            if curl -fL --retry 2 \
              "$BASE/$TAG/$FILE" \
              -o archi.tgz; then
              break
            fi

            rm -f archi.tgz
          done

          test -s archi.tgz

          tar -tzf archi.tgz > /dev/null
          tar -xzf archi.tgz -C archi-dist

          echo "Archi successfully extracted"
          ls -la archi-dist

      - name: Prepare dependencies
        run: |
          mkdir -p dependencies

          python3 - <<'PY'
          import pathlib
          import zipfile

          root = pathlib.Path("archi-dist")
          output = pathlib.Path("dependencies")

          jars = list(root.rglob("plugins/*.jar"))

          if not jars:
              raise SystemExit("No dependency JARs found")

          for i, jar in enumerate(jars):
              with zipfile.ZipFile(jar) as z:
                  for j, name in enumerate(z.namelist()):
                      if name.endswith(".jar"):
                          target = output / f"{i}-{j}-{pathlib.Path(name).name}"
                          target.write_bytes(z.read(name))

          jars += list(output.glob("*.jar"))

          cp = ":".join(str(p.resolve()) for p in jars)

          pathlib.Path("classpath.txt").write_text(cp)

          print("Dependency JARs:", len(jars))
          PY

      - name: Compile and package coArchi2
        shell: bash
        run: |
          set -euo pipefail

          MAIN=com.archimatetool.modelrepository
          CLI=com.archimatetool.modelrepository.commandline
          CP=$(cat classpath.txt)
          VERSION=1.3.5.$(date -u +%Y%m%d%H%M)

          mkdir -p build/main-classes
          mkdir -p build/cli-classes
          mkdir -p build/main-bundle
          mkdir -p build/cli-bundle
          mkdir -p build/package
          mkdir -p dist

          echo "Building coArchi2 $VERSION"

          grep -q 'Bundle-Version: 1.3.5' \
            "$MAIN/META-INF/MANIFEST.MF"

          find "$MAIN/src" \
            -name '*.java' > build/main-sources.txt

          javac --release 21 \
            -encoding UTF-8 \
            -cp "$CP" \
            -d build/main-classes \
            @build/main-sources.txt

          find "$CLI/src" \
            -name '*.java' > build/cli-sources.txt

          javac --release 21 \
            -encoding UTF-8 \
            -cp "$CP:$PWD/build/main-classes" \
            -d build/cli-classes \
            @build/cli-sources.txt

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          projects = [
              ("com.archimatetool.modelrepository", "main"),
              ("com.archimatetool.modelrepository.commandline", "cli")
          ]

          for project, name in projects:
              src = Path(project) / "src"
              dst = Path("build") / (name + "-classes")

              for p in src.rglob("*"):
                  if p.is_file() and p.suffix != ".java":
                      target = dst / p.relative_to(src)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(p, target)
          PY

          for item in LICENSE.txt plugin.xml plugin.properties img help logging.properties; do
            if [ -e "$MAIN/$item" ]; then
              cp -r "$MAIN/$item" build/main-bundle/
            fi
          done

          for item in LICENSE.txt plugin.xml plugin.properties; do
            if [ -e "$CLI/$item" ]; then
              cp -r "$CLI/$item" build/cli-bundle/
            fi
          done

          cp -r "$MAIN/META-INF" build/main-bundle/
          cp -r "$CLI/META-INF" build/cli-bundle/

          sed -i "s/^Bundle-Version:.*/Bundle-Version: $VERSION/" \
            build/main-bundle/META-INF/MANIFEST.MF \
            build/cli-bundle/META-INF/MANIFEST.MF

          jar --create \
            --file "build/main-bundle/$MAIN.jar" \
            -C build/main-classes .

          cp -r build/cli-classes/. build/cli-bundle/

          jar --create \
            --file "build/package/${MAIN}_${VERSION}.jar" \
            --manifest build/main-bundle/META-INF/MANIFEST.MF \
            -C build/main-bundle .

          jar --create \
            --file "build/package/${CLI}_${VERSION}.jar" \
            --manifest build/cli-bundle/META-INF/MANIFEST.MF \
            -C build/cli-bundle .

          printf '%s' \
            'Magic file to signify this is an Archi plug-in bundle.' \
            > build/package/archi-plugin

          cd build/package
          zip -r ../../dist/coArchi2_1.3.5.archiplugin .
          cd ../..

          echo "Build completed"
          unzip -l dist/coArchi2_1.3.5.archiplugin

      - name: Verify plugin archive
        run: |
          unzip -t dist/coArchi2_1.3.5.archiplugin
          sha256sum dist/coArchi2_1.3.5.archiplugin
          ls -lh dist/

      - name: Upload coArchi2 plugin
        uses: actions/upload-artifact@v4
        with:
          name: coArchi2-1.3.5
          path: dist/coArchi2_1.3.5.archiplugin
          if-no-files-found: error
